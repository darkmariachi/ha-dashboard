services:
  ha-dashboard:
    build:
      context: .
    container_name: ha-dashboard
    # Read from .env at `docker compose up` time and only ever used by nginx
    # inside the container (see spotify-auth.envsh) — not part of the build.
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    ports:
      - "8081:80"
    restart: unless-stopped

  # Web push for the PWA (push/server.mjs). The dashboard's nginx proxies
  # the phone-facing endpoints at /api/push/*; Home Assistant calls /send
  # directly on the LAN port with PUSH_SECRET. Keys/secret live in .env.
  push:
    build:
      context: ./push
    container_name: ha-dashboard-push
    environment:
      HA_URL: ${PUSH_HA_URL:-http://192.168.1.54:8123}
      PUSH_SECRET: ${PUSH_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      # Door-open alerts: long-lived HA token; empty disables them.
      HA_TOKEN: ${PUSH_HA_TOKEN:-}
      DOOR_ALERT_MINUTES: ${DOOR_ALERT_MINUTES:-2}
      DOOR_REPEAT_MINUTES: ${DOOR_REPEAT_MINUTES:-10}
      DOOR_OFFLINE_MINUTES: ${DOOR_OFFLINE_MINUTES:-10}
    volumes:
      - ./push-data:/data
    # LAN only, for HA (rest_command.dashboard_push -> :8094/send). 8082 is
    # taken on skylab by daily-reset; inside the container it's still 8082.
    ports:
      - "192.168.1.54:8094:8082"
    restart: unless-stopped
