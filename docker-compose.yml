services:
  ha-dashboard:
    build:
      context: .
    container_name: ha-dashboard
    # Read from .env at `docker compose up` time and only ever used by nginx
    # inside the container (see spotify-auth.envsh) — not part of the build.
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # nginx checks HA tokens here before handing out Spotify tokens.
      HA_URL: ${PUSH_HA_URL:-http://192.168.1.54:8123}
    ports:
      - "8081:80"
    restart: unless-stopped

  # Web push for the PWA (push/server.mjs). The dashboard's nginx proxies
  # the phone-facing endpoints at /api/push/*; Home Assistant calls /send
  # directly on the LAN port with PUSH_SECRET. Keys/secret live in .env.
  push:
    build:
      context: ./push
    container_name: ha-dashboard-push
    environment:
      HA_URL: ${PUSH_HA_URL:-http://192.168.1.54:8123}
      PUSH_SECRET: ${PUSH_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      # Door-open alerts: long-lived HA token; empty disables them.
      HA_TOKEN: ${PUSH_HA_TOKEN:-}
      DOOR_ALERT_MINUTES: ${DOOR_ALERT_MINUTES:-2}
      DOOR_REPEAT_MINUTES: ${DOOR_REPEAT_MINUTES:-10}
      DOOR_OFFLINE_MINUTES: ${DOOR_OFFLINE_MINUTES:-10}
      # "Lights are unreachable" alerts (which lights: UNREACHABLE_GROUPS in
      # push/server.mjs). Uses HA_TOKEN too.
      UNREACHABLE_MINUTES: ${UNREACHABLE_MINUTES:-2}
      UNREACHABLE_PEOPLE: ${UNREACHABLE_PEOPLE:-rodolfo,priscilla}
    volumes:
      - ./push-data:/data
    # LAN only, for HA (rest_command.dashboard_push -> :8094/send). 8082 is
    # taken on skylab by daily-reset; inside the container it's still 8082.
    ports:
      - "192.168.1.54:8094:8082"
    restart: unless-stopped

  # Face recognition for the Visitors page (faces/app.py): watches HA for
  # Protect person detections and doorbell rings, keeps face crops and
  # embeddings in faces-data/faces.db. Only reachable through the
  # dashboard's nginx at /api/faces/ (no published port).
  faces:
    build:
      context: ./faces
    container_name: ha-dashboard-faces
    # Inference would otherwise take all 4 of skylab's cores during a
    # backfill (load ~5, starving HA, Plex and the game servers). Live
    # detections jump the queue, so the cap only slows the backfill.
    cpus: "2.0"
    environment:
      HA_URL: ${PUSH_HA_URL:-http://192.168.1.54:8123}
      HA_TOKEN: ${PUSH_HA_TOKEN:-}
      # Doorbell / arrival / unknown-face alerts go through the push service.
      PUSH_URL: http://push:8082/send
      PUSH_SECRET: ${PUSH_SECRET:-}
      # Household members who get an "is home" alert (2 h apart, 6 am-11 pm).
      NOTIFY_HOUSEHOLD: ${FACES_NOTIFY_HOUSEHOLD:-Andres,Daniel}
    volumes:
      - ./faces-data:/data
    restart: unless-stopped

  # Unnamed-device detection for the Energy page (nilm/app.py): splits the
  # load Sense hasn't identified into devices by their on/off steps, and
  # mirrors them into HA as sensor.nilm_device_*. Uses Sense's realtime
  # stream when SENSE_EMAIL/SENSE_PASSWORD are set, else HA's ~2-minute
  # Sense updates. Only reachable through the dashboard's nginx at
  # /api/nilm/ (no published port).
  nilm:
    build:
      context: ./nilm
    container_name: ha-dashboard-nilm
    environment:
      HA_URL: ${PUSH_HA_URL:-http://192.168.1.54:8123}
      HA_TOKEN: ${PUSH_HA_TOKEN:-}
      SENSE_EMAIL: ${SENSE_EMAIL:-}
      SENSE_PASSWORD: ${SENSE_PASSWORD:-}
      NILM_PUBLISH: ${NILM_PUBLISH:-1}
    volumes:
      - ./nilm-data:/data
    restart: unless-stopped
