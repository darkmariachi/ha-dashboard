# Rendered by the nginx image's envsubst step at container start (copied to
# /etc/nginx/templates/default.conf.template), so ${SPOTIFY_BASIC_AUTH} below
# is filled in from the environment — see spotify-auth.envsh. nginx's own
# $variables are left alone, since envsubst only touches defined env vars.

# The token endpoint is reachable from the internet once this sits behind
# SWAG, so cap how often anyone can mint tokens on our Spotify app's behalf.
limit_req_zone $binary_remote_addr zone=spotify_token:1m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything the app connects to (the HA websocket + REST API) happens
    # client-side, straight from the browser to Home Assistant. The one
    # exception is Spotify's token endpoint below, which needs the app's
    # client secret — so it's added here instead of shipping in the JS.

    location = /api/spotify-token {
        limit_req zone=spotify_token burst=5 nodelay;
        limit_except POST { deny all; }
        # Only hand out tokens to callers holding a valid HA token (sent as
        # "Authorization: Bearer ..."), so this isn't an open proxy for our
        # Spotify app.
        auth_request /_ha_auth;

        set $spotify_auth "${SPOTIFY_BASIC_AUTH}";
        if ($spotify_auth = "") {
            return 503;
        }

        proxy_pass https://accounts.spotify.com/api/token;
        proxy_ssl_server_name on;
        proxy_set_header Host accounts.spotify.com;
        proxy_set_header Authorization "Basic $spotify_auth";
        proxy_set_header Content-Type "application/x-www-form-urlencoded";
        proxy_set_header Cookie "";
    }

    # auth_request target: HA's /api/ answers 200 for a valid token and 401
    # otherwise. The real client IP is forwarded (this container's network is
    # in HA's trusted_proxies) so HA's ip_ban blames the caller, not us.
    location = /_ha_auth {
        internal;
        proxy_pass ${HA_URL}/api/;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Phone-facing web push endpoints (push/server.mjs). /send is HA-only and
    # stays on the LAN port, so it's refused here. The upstream is resolved
    # per request through Docker's DNS, so this container still starts if
    # the push service is down.
    location = /api/push/send {
        return 404;
    }
    location /api/push/ {
        resolver 127.0.0.11 valid=30s;
        set $push_upstream push:8082;
        rewrite ^/api/push/(.*)$ /$1 break;
        proxy_pass http://$push_upstream;
        proxy_set_header Host $host;
        client_max_body_size 16k;
    }

    # Service worker + manifest must never be cached long, or installed
    # PWAs would keep running an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
}
